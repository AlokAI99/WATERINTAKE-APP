<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b5fff" />
  <title>Aqua — Water Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">GOOD MORNING</p>
        <h1>Stay refreshed</h1>
      </div>
      <button class="settings" id="goalButton" aria-label="Change daily goal">⚙</button>
    </header>

    <section class="hero" aria-label="Today's water progress">
      <div class="ring" id="ring"><div class="ring-content"><strong id="total">0</strong><span>of <b id="goalText">2,000</b> ml</span></div></div>
      <div class="hero-copy">
        <p id="message">Let’s take the first sip.</p>
        <span id="percent">0% of your goal</span>
      </div>
    </section>

    <section class="add-section">
      <h2>Quick add</h2>
      <div class="quick-buttons">
        <button data-amount="150">150<span>ml</span></button>
        <button data-amount="250">250<span>ml</span></button>
        <button data-amount="350">350<span>ml</span></button>
        <button data-amount="500">500<span>ml</span></button>
      </div>
      <form id="customForm">
        <input id="customAmount" type="number" min="1" max="5000" placeholder="Custom amount" aria-label="Custom water amount in millilitres" />
        <button type="submit">Add water</button>
      </form>
    </section>

    <section class="history">
      <div class="section-heading"><h2>Today’s sips</h2><button id="reset">Clear day</button></div>
      <ul id="entries" aria-live="polite"></ul>
      <p class="empty" id="empty">No water logged yet. Your first glass is waiting.</p>
    </section>
  </main>
  <dialog id="goalDialog">
    <form method="dialog" id="goalForm">
      <h2>Daily goal</h2>
      <p>Set the amount you’d like to drink each day.</p>
      <input id="goalInput" type="number" min="250" max="10000" step="50" required />
      <label for="goalInput">millilitres</label>
      <div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button value="default" id="saveGoal">Save goal</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
